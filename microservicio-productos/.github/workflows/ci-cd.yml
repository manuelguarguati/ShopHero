name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION: us-central1
  CLUSTER: cluster-microservicios
  ZONE: us-central1-a
  IMAGE_NAME: microservicio-productos

jobs:
  # 1) Compilar / instalar y ejecutar pruebas unitarias
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Construir imagen Docker (validación)
        run: docker build -t $IMAGE_NAME:test .

  # 2) Publicar imagen y desplegar en el cluster (solo en main)
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud y kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Construir y subir imagen
        run: |
          IMAGE=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservicios/${IMAGE_NAME}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Obtener credenciales del cluster
        run: gcloud container clusters get-credentials $CLUSTER --zone $ZONE

      - name: Desplegar en Kubernetes
        run: |
          sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/microservicio-productos --timeout=120s
