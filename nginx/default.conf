limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # DNS interno de Docker para re-resolver contenedores si se recrean o reinician
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Cabeceras de seguridad y CORS
    add_header 'X-Content-Type-Options' 'nosniff' always;
    add_header 'X-Frame-Options' 'SAMEORIGIN' always;
    add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, Cache-Control, X-Requested-With' always;

    location = /health {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        set $upstream_carrito http://carrito:3001;
        rewrite ^ /health break;
        proxy_pass $upstream_carrito;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/productos {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        set $upstream_productos http://productos:3000;
        rewrite ^ /health break;
        proxy_pass $upstream_productos;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/carrito {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        set $upstream_carrito http://carrito:3001;
        rewrite ^ /health break;
        proxy_pass $upstream_carrito;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/pedidos {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        set $upstream_pedidos http://pedidos:3002;
        rewrite ^ /health break;
        proxy_pass $upstream_pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/carritos {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        limit_req zone=api_limit burst=50 nodelay;
        set $upstream_carrito http://carrito:3001;
        proxy_pass $upstream_carrito;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/productos {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        limit_req zone=api_limit burst=50 nodelay;
        set $upstream_productos http://productos:3000;
        proxy_pass $upstream_productos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/pedidos {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        limit_req zone=api_limit burst=30 nodelay;
        set $upstream_pedidos http://pedidos:3002;
        proxy_pass $upstream_pedidos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/outbox {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        limit_req zone=api_limit burst=30 nodelay;
        set $upstream_pedidos http://pedidos:3002;
        proxy_pass $upstream_pedidos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /prometheus/ {
        set $upstream_prometheus http://prometheus:9090;
        proxy_pass $upstream_prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
