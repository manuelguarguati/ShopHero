apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio-carrito
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio-carrito
  template:
    metadata:
      labels:
        app: microservicio-carrito
    spec:
      containers:
        - name: carrito
          image: ghcr.io/manuelguarguati/shophero/microservicio-carrito:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: CARRITO_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: REDIS_URL
            - name: PRODUCTOS_URL
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: PRODUCTOS_URL
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: shophero-secrets
                  key: jwt-public-key
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: microservicio-carrito
spec:
  type: ClusterIP
  selector:
    app: microservicio-carrito
  ports:
    - port: 3001
      targetPort: 3001
