apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio-carrito
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio-carrito
  template:
    metadata:
      labels:
        app: microservicio-carrito
    spec:
      automountServiceAccountToken: false
      containers:
        - name: carrito
          image: ghcr.io/manuelguarguati/shophero/microservicio-carrito:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: CARRITO_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: REDIS_URL
            - name: PRODUCTOS_URL
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: PRODUCTOS_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shophero-secrets
                  key: redis-password
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: JWT_AUDIENCE
            - name: OTEL_SERVICE_NAME
              value: carrito
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: shophero-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shophero-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: microservicio-carrito
spec:
  type: ClusterIP
  selector:
    app: microservicio-carrito
  ports:
    - port: 3001
      targetPort: 3001
