name: ShopHero CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/cloud-native-triada]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [microservicio-productos, microservicio-carrito]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  images:
    name: Build, scan and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        shell: bash
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          for service in microservicio-productos microservicio-carrito; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${service}:ci"
            docker build --file "$service/Dockerfile" --tag "$image" "$service"
          done
      - name: Scan microservicio-productos image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/microservicio-productos:ci
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: 'HIGH,CRITICAL'
      - name: Scan microservicio-carrito image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/microservicio-carrito:ci
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: 'HIGH,CRITICAL'
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          for service in microservicio-productos microservicio-carrito; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${service}"
            docker tag "$image:ci" "$image:${GITHUB_SHA}"
            docker push "$image:${GITHUB_SHA}"
          done
