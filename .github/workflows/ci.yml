name: ShopHero CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/cloud-native-triada]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [microservicio-productos, microservicio-carrito]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  images:
    name: Build, scan and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and scan images
        shell: bash
        run: |
          for service in microservicio-productos microservicio-carrito; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${service}:ci"
            docker build --file "$service/Dockerfile" --tag "$image" "$service"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          for service in microservicio-productos microservicio-carrito; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${service}"
            docker tag "$image:ci" "$image:${GITHUB_SHA}"
            docker push "$image:${GITHUB_SHA}"
          done
